services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # FFmpeg consumer of the video-processing queue. Separate image because
  # FFmpeg is a large native dependency that only this process uses.
  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    volumes:
      - .:/home/node/app
    # O worker roda a aplicacao de verdade, ao contrario do `nestjs-api`, que fica
    # ocioso com `tail -f /dev/null`. Como o `node_modules` mora no bind mount e a
    # ordem sugerida no enunciado e `docker compose up` ANTES de `npm install`, num
    # clone limpo o worker subia sem dependencia, morria com `ts-node not found` e
    # nao voltava, deixando a fila sem consumidor e o e2e de video em timeout.
    # Esperar o `node_modules` aparecer torna a ordem dos comandos irrelevante.
    command: >-
      sh -c "until [ -x node_modules/.bin/ts-node ]; do echo 'video-worker aguardando npm install'; sleep 3; done; exec npm run worker"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3-compatible object storage. Stands in for S3 in production; the
  # application talks to it through @aws-sdk/client-s3 either way.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=streamtube
      - MINIO_ROOT_PASSWORD=streamtube
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      default:
        aliases:
          # A second name for the same service, so the "public" endpoint used
          # to sign browser-bound URLs is textually distinct from the internal
          # one while still resolving on this network. In production this alias
          # is the real public domain of the storage or of its CDN.
          - storage.streamtube.local
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the buckets once and exits. Bucket provisioning is infrastructure,
  # not application boot: the API would otherwise need admin credentials it has
  # no other reason to hold.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 streamtube streamtube &&
      mc mb --ignore-existing local/streamtube-videos &&
      mc mb --ignore-existing local/streamtube-thumbnails &&
      echo 'buckets ready'
      "

  # Backing store for the BullMQ processing queue.
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
  redis-data:
